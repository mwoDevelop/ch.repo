name: propose WatchNixtoons2 upstream update

on:
  workflow_dispatch:
  schedule:
    - cron: "35 4 * * *"

concurrency:
  group: mwodevelop-watchnixtoons2-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      action: ${{ steps.discovery.outputs.action }}
      base_commit: ${{ steps.discovery.outputs.base_commit }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
      downstream_version: ${{ steps.candidate.outputs.downstream_version }}
      expected_tree: ${{ steps.candidate.outputs.expected_tree }}
      upstream_version: ${{ steps.discovery.outputs.upstream_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Discover the current immutable upstream release
        run: >-
          python3 tools/prepare_mwodevelop_watchnixtoons2_update.py discover
          --output discovery.json
      - name: Export discovery result
        id: discovery
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          discovery = json.loads(Path("discovery.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("action=%s\n" % discovery["action"])
              output.write("base_commit=%s\n" % __import__("subprocess").check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip())
              output.write("upstream_version=%s\n" % discovery["observed"]["version"])
          PY
      - name: Materialize an isolated candidate without executing it
        if: steps.discovery.outputs.action == 'prepare'
        run: >-
          python3 tools/prepare_mwodevelop_watchnixtoons2_update.py prepare
          --discovery discovery.json
          --output candidate
      - name: Export candidate identity
        if: steps.discovery.outputs.action == 'prepare'
        id: candidate
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          candidate = json.loads(Path("candidate/candidate.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("candidate_id=%s\n" % candidate["candidate_id"])
              output.write(
                  "downstream_version=%s\n"
                  % candidate["metadata"]["downstream_version"]
              )
              output.write(
                  "expected_tree=%s\n" % candidate["metadata"]["expected_tree"]
              )
          PY
      - name: Scan exact candidate before executing tests
        if: steps.discovery.outputs.action == 'prepare'
        uses: mwoDevelop/kodi/.github/actions/upstream-malware-scan@8b4fe96708d1e2e64cf535e3726fa7a9a4a1adb6
        with:
          baseline: .github/security-baseline.json
          candidate-path: candidate
          candidate-id: ${{ steps.candidate.outputs.candidate_id }}
          output: security-report.json
      - name: Test the scanned content-addressed candidate
        if: steps.discovery.outputs.action == 'prepare'
        run: >-
          python3 tools/prepare_mwodevelop_watchnixtoons2_update.py test
          --bundle candidate
      - name: Upload the content-addressed candidate
        if: steps.discovery.outputs.action == 'prepare'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchnixtoons2-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Upload scanner attestation
        if: steps.discovery.outputs.action == 'prepare'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchnixtoons2-security
          path: security-report.json
          if-no-files-found: error
          retention-days: 7

  propose:
    needs: prepare
    if: needs.prepare.outputs.action == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.base_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: watchnixtoons2-candidate
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: watchnixtoons2-security
          path: security
      - name: Verify scanner attestation against downloaded bytes
        env:
          CANDIDATE_ID: ${{ needs.prepare.outputs.candidate_id }}
          SECURITY_CONTROL_SHA: 8b4fe96708d1e2e64cf535e3726fa7a9a4a1adb6
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/mwodevelop-security-control"
          git init "$control"
          git -C "$control" remote add origin https://github.com/mwoDevelop/kodi.git
          git -C "$control" fetch --depth 1 origin "$SECURITY_CONTROL_SHA"
          test "$(git -C "$control" rev-parse FETCH_HEAD)" = "$SECURITY_CONTROL_SHA"
          git -C "$control" checkout --detach FETCH_HEAD
          python "$control/tools/upstream_security_scan.py" verify \
            --baseline .github/security-baseline.json \
            --candidate candidate \
            --candidate-id "$CANDIDATE_ID" \
            --report security/security-report.json \
            --policy "$control/manifests/upstream-security.json"
      - name: Verify and apply without executing candidate code
        run: >-
          python3 tools/prepare_mwodevelop_watchnixtoons2_update.py apply
          --bundle candidate
          --checkout .
      - name: Open or update the review branch
        env:
          BRANCH: automation/watchnixtoons2-upstream
          CANDIDATE_ID: ${{ needs.prepare.outputs.candidate_id }}
          DOWNSTREAM_VERSION: ${{ needs.prepare.outputs.downstream_version }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.expected_tree }}
          BASE_COMMIT: ${{ needs.prepare.outputs.base_commit }}
          UPSTREAM_VERSION: ${{ needs.prepare.outputs.upstream_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "mwoDevelop update bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch_updated=false
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$BASE_COMMIT"
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH" &&
             git log -1 --format=%B "refs/remotes/origin/$BRANCH" |
               grep -Fq "Candidate-ID: $CANDIDATE_ID"; then
            test "$(git show -s --format=%P "refs/remotes/origin/$BRANCH")" = "$BASE_COMMIT"
            test "$(git show -s --format=%T "refs/remotes/origin/$BRANCH")" = "$EXPECTED_TREE"
            test "$(git show -s --format=%ae "refs/remotes/origin/$BRANCH")" = \
              "41898282+github-actions[bot]@users.noreply.github.com"
            echo "Review branch already contains candidate $CANDIDATE_ID"
          else
            git checkout -B "$BRANCH"
            git add \
              mwodevelop/README.md \
              mwodevelop/import-manifest.json \
              mwodevelop/transforms/addon_identity.json \
              mwodevelop/upstream.json \
              mwodevelop/plugin.video.watchnixtoons2.mwodevelop
            test "$(git write-tree)" = "$EXPECTED_TREE"
            git diff --cached --quiet &&
              { echo "Candidate produced no managed changes"; exit 1; }
            git commit -m "Update WatchNixtoons2 to $DOWNSTREAM_VERSION" \
              -m "Upstream: $UPSTREAM_VERSION" \
              -m "Candidate-ID: $CANDIDATE_ID"
            remote_sha="$(
              git show-ref --hash "refs/remotes/origin/$BRANCH" 2>/dev/null || true
            )"
            if [ -n "$remote_sha" ]; then
              git push origin "HEAD:refs/heads/$BRANCH" \
                "--force-with-lease=refs/heads/$BRANCH:$remote_sha"
            else
              git push origin "HEAD:refs/heads/$BRANCH"
            fi
            branch_updated=true
          fi
          body_file="$(mktemp)"
          {
            echo "Automated, review-gated WatchNixtoons2 import."
            echo
            echo "- Upstream version: \`$UPSTREAM_VERSION\`"
            echo "- Proposed downstream version: \`$DOWNSTREAM_VERSION\`"
            echo "- Candidate ID: \`$CANDIDATE_ID\`"
            echo
            echo "The unprivileged preparation job rebuilt and tested the package."
            echo "The writer job only verified and copied allowlisted candidate files."
            echo "Merging this PR does not publish or promote the Kodi repository."
          } > "$body_file"
          number="$(
            gh pr list --state open --head "$BRANCH" --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "$number" ]; then
            gh pr edit "$number" \
              --title "Update WatchNixtoons2 to $DOWNSTREAM_VERSION" \
              --body-file "$body_file"
          else
            gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "Update WatchNixtoons2 to $DOWNSTREAM_VERSION" \
              --body-file "$body_file"
          fi
          if [ "$branch_updated" = true ]; then
            head_sha="$(git rev-parse HEAD)"
          else
            head_sha="$(git rev-parse "refs/remotes/origin/$BRANCH")"
          fi
          gh workflow run mwodevelop-watchnixtoons2.yml --ref "$BRANCH"
          found=false
          for attempt in $(seq 1 15); do
            run_head="$(gh run list --workflow mwodevelop-watchnixtoons2.yml \
              --branch "$BRANCH" --event workflow_dispatch --limit 1 \
              --json headSha --jq '.[0].headSha // empty')"
            if [ "$run_head" = "$head_sha" ]; then
              found=true
              break
            fi
            sleep 2
          done
          test "$found" = true
