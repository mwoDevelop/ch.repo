name: mwoDevelop WatchNixtoons2

on:
  push:
    paths:
      - "mwodevelop/**"
      - ".github/workflows/mwodevelop-watchnixtoons2.yml"
  pull_request:
    paths:
      - "mwodevelop/**"
      - ".github/workflows/mwodevelop-watchnixtoons2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate downstream package
        run: python -m unittest discover -s mwodevelop/tests -v
