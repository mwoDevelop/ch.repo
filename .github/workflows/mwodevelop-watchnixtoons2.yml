name: mwoDevelop WatchNixtoons2

on:
  push:
    paths:
      - "mwodevelop/**"
      - "tools/prepare_mwodevelop_watchnixtoons2_update.py"
      - ".github/workflows/mwodevelop-watchnixtoons2.yml"
      - ".github/workflows/mwodevelop-watchnixtoons2-update.yml"
  pull_request:
    paths:
      - "mwodevelop/**"
      - "tools/prepare_mwodevelop_watchnixtoons2_update.py"
      - ".github/workflows/mwodevelop-watchnixtoons2.yml"
      - ".github/workflows/mwodevelop-watchnixtoons2-update.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  malware-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Export exact managed code from the tracked head
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate-tree"
          git archive HEAD -- mwodevelop tools |
            tar -x -C "$RUNNER_TEMP/candidate-tree"
      - name: Scan exact head before executing addon code
        uses: mwoDevelop/kodi/.github/actions/upstream-malware-scan@8b4fe96708d1e2e64cf535e3726fa7a9a4a1adb6
        with:
          baseline: .github/security-baseline.json
          candidate-path: ${{ runner.temp }}/candidate-tree
          output: ${{ runner.temp }}/security-report.json

  test:
    needs: malware-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate downstream package
        run: python -m unittest discover -s mwodevelop/tests -v
